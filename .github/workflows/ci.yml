name: CI

on:
  push:
    branches: [main, refactor/memory-provider]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install whoosh-ng and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install whoosh-ng whoosh-modern numpy
          pip install -e .[dev]

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Verify plugin imports
        run: |
          HERMES_HOME=/tmp/hermes-test python -c "
          from whoosh_memory.provider import register, WhooshMemoryProvider
          from whoosh_memory.config import hermes_home
          assert hermes_home() == '/tmp/hermes-test'
          print('Plugin import + config OK')
          "
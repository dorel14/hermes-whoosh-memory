name: whoosh-memory
version: "0.4.0"
description: "Mémoire locale hybride (BM25 + vecteurs optionnels) sur whoosh-ng : indexe les conversations et les entrées MEMORY.md / USER.md, injecte le contexte pertinent avant chaque tour. 100 % local."
author: "David Orel (dorel14)"
license: MIT
homepage: https://github.com/dorel14/hermes-whoosh-memory
requires_hermes: ">=0.21"
tags: [memory, whoosh, search]
hooks:
  - prefetch
  - sync_turn
  - on_memory_write
  - on_session_end
  - on_session_switch
  - system_prompt_block

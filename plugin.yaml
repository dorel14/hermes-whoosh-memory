name: whoosh-memory
version: 0.3.0
description: "Local hybrid (BM25 + vector) memory provider: indexes Hermes session history, MEMORY.md / USER.md, local documents and skills into a whoosh-ng index for fast offline retrieval, with automatic context prefetch before each turn."
author: "NousResearch"
license: MIT
homepage: https://github.com/NousResearch/hermes-whoosh-memory
requires_hermes: ">=0.21"
tags: [memory, whoosh, search]
# 100% local, no network calls. The whoosh-ng backend (pure-Python) is imported
# lazily by indexer.py / search.py so the package stays importable and inspectable
# even before whoosh-ng is installed. Vector (semantic) support is optional and
# degrades gracefully to BM25-only.
provides_tools: [whoosh_search, whoosh_open, whoosh_index, whoosh_forget, whoosh_stats, whoosh_add]
provides_hooks: [prefetch, sync_turn, on_memory_write, on_session_end, on_pre_compress, system_prompt_block, initialize]
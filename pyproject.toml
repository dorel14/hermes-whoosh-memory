# Déclaration des dépendances lue par Hermes (pm/plugin_declarations.py :
# read_python_declaration). Volontairement SANS [build-system] ni
# [project.optional-dependencies] : le plugin reste un plugin répertoire dont
# seules les `dependencies` sont résolues dans l'environnement partagé de
# Hermes, après consentement, au moment de l'activation.
#
# Dépendances optionnelles (à installer à la main dans l'environnement Hermes) :
#   fastembed>=0.3,<1                (embeddings locaux CPU/ONNX)
#   sentence-transformers>=2.5,<4    (embeddings PyTorch)
#   ollama>=0.1,<1                   (embeddings via un serveur Ollama local)
#   Pillow>=10,<12                   (images)

[project]
name = "hermes-whoosh-memory"
version = "0.4.0"
description = "Mémoire locale hybride (BM25 + vecteurs optionnels) pour Hermes Agent, basée sur whoosh-ng."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Orel (dorel14)" }]
dependencies = [
    "whoosh-ng>=5.4,<6",
]

[project.urls]
Homepage = "https://github.com/dorel14/hermes-whoosh-memory"
Issues = "https://github.com/dorel14/hermes-whoosh-memory/issues"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
# La racine du dépôt est elle-même un package (le plugin) : import mode
# "importlib" pour que pytest n'essaie pas d'importer le __init__.py racine.
addopts = "--import-mode=importlib"
testpaths = ["tests"]

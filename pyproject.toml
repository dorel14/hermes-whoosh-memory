[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-whoosh-memory"
version = "0.3.0"
description = "Local hybrid (BM25 + vector) memory provider for Hermes Agent: indexes session history, MEMORY.md / USER.md, local documents, skills and images into a whoosh-ng index for fast offline retrieval with context prefetch."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "NousResearch", email = "contact@nousresearch.com"}]
keywords = ["hermes", "memory", "whoosh", "search", "bm25", "vector", "images"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "whoosh-ng>=0.3.0",
]

[project.optional-dependencies]
embeddings = [
    "fastembed>=0.3.0",
]
sentence-transformers = [
    "sentence-transformers>=2.5.0",
]
ollama = [
    "ollama>=0.1.0",
]
images = [
    "Pillow>=10.0.0",
]
all = [
    "whoosh-ng>=0.3.0",
    "fastembed>=0.3.0",
    "Pillow>=10.0.0",
]

[project.scripts]
whoosh-memory = "whoosh_memory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["whoosh_memory*"]

[tool.setuptools.package-data]
whoosh_memory = ["plugin.yaml"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "S"]